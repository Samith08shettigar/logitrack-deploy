databases:
  - name: logistic-db
    plan: free
    databaseName: logitrack_db
    user: logitrack_user

services:
  - type: web
    name: logitrack
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: logistic-db
          property: connectionString

