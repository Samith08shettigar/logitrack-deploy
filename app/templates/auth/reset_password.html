{% extends "base.html" %}

{% block public_content %}
<div class="auth-bg py-5">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-md-5">
                <div class="text-center text-white mb-4">
                    <i class="fa-solid fa-truck-ramp-box fa-3x mb-3 text-warning"></i>
                    <h2 class="fw-bold">Reset Portal Password</h2>
                    <p class="text-white-50">Provide your registered email and choose a new password</p>
                </div>
                
                <div class="card border-0 glass-card">
                    <div class="card-body p-4">
                        <form method="POST" action="{{ url_for('auth.reset_password') }}">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Registered Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                    <input type="email" name="email" class="form-control bg-light border-start-0" placeholder="Enter your email" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label small fw-bold">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="new_password" class="form-control bg-light border-start-0" placeholder="Enter new password" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="confirm_password" class="form-control bg-light border-start-0" placeholder="Confirm new password" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fa-solid fa-shield-halved me-2"></i>Update Password</button>
                        </form>
                        
                        <div class="text-center mt-4 border-top pt-3">
                            <span class="small text-muted">Remember your password? <a href="{{ url_for('auth.login') }}" class="fw-bold text-decoration-none text-primary">Login here</a></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
