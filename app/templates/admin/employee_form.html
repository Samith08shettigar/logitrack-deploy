{% extends "base.html" %}

{% block title %}{{ action }} Employee - LogiTrack{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card border-0 shadow-sm kpi-card">
            <div class="card-header bg-primary text-white py-3" style="border-radius: 12px 12px 0 0;">
                <h5 class="mb-0 fw-bold"><i class="fa-solid fa-user-tie me-2 text-warning"></i>{{ action }} Employee Account</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% if action == "Add" %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                    </div>
                    {% else %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" class="form-control" value="{{ employee.username }}" disabled>
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ employee.email if employee else '' }}" placeholder="Enter email address" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">System Role Assignment</label>
                        <select name="role_id" class="form-select" required>
                            {% for r in roles %}
                                <option value="{{ r.id }}" {% if employee and employee.role_id == r.id %}selected{% endif %}>{{ r.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3" id="branch-select-container" style="display: none;">
                        <label class="form-label small fw-bold">Assigned Branch</label>
                        <select name="branch_id" class="form-select">
                            <option value="">-- Select Branch (For Branch Managers) --</option>
                            {% for b in branches %}
                                <option value="{{ b.id }}" {% if employee and employee.branch_id == b.id %}selected{% endif %}>{{ b.name }} ({{ b.code }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if not employee or employee.is_active %}checked{% endif %}>
                            <label class="form-check-label small fw-bold" for="is_active">Account Allowed to Log In</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">{% if action == "Edit" %}Update Password (Leave blank to keep current){% else %}Account Password{% endif %}</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" {% if action == "Add" %}required{% endif %}>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="fa-solid fa-circle-check me-2"></i>Save Employee</button>
                        <a href="{{ url_for('admin.list_employees') }}" class="btn btn-outline-secondary w-50">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const roleSelect = document.querySelector('select[name="role_id"]');
    const branchContainer = document.getElementById('branch-select-container');
    const branchSelect = document.querySelector('select[name="branch_id"]');
    
    function toggleBranchSelect() {
        if (!roleSelect) return;
        const selectedText = roleSelect.options[roleSelect.selectedIndex].text;
        if (selectedText.includes('Branch Manager') || selectedText.includes('Manager')) {
            branchContainer.style.display = 'block';
        } else {
            branchContainer.style.display = 'none';
            if (branchSelect) branchSelect.value = '';
        }
    }
    
    if (roleSelect && branchContainer) {
        roleSelect.addEventListener('change', toggleBranchSelect);
        toggleBranchSelect(); // Run once initially
    }
});
</script>
{% endblock %}
